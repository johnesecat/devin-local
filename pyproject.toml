[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "devin-local"
version = "0.1.0"
description = "100% local, free, private autonomous AI software engineer agent powered by Ollama."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "devin-local contributors" }]
keywords = ["ai", "agent", "ollama", "local", "llm", "autonomous"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows :: Windows 10",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]
dependencies = [
    "httpx>=0.27",
    "rich>=13.7",
    "prompt_toolkit>=3.0.43",
    "pydantic>=2.6",
    "typer>=0.12",
    "pyyaml>=6.0",
    "colorama>=0.4.6; platform_system == 'Windows'",
]

[project.optional-dependencies]
desktop = ["pyautogui>=0.9.54", "pillow>=10.0"]
browser = ["playwright>=1.42", "beautifulsoup4>=4.12"]
mcp = ["mcp>=1.0"]
gui = [
    "PySide6>=6.6",
    "pillow>=10.0",
    "pygments>=2.17",
]
layered = [
    # AirLLM does layer-by-layer quantized loading on top of these libs.
    "airllm>=2.11",
    "torch>=2.2",
    "transformers>=4.41",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
]
hf = [
    "torch>=2.2",
    "transformers>=4.41",
    "accelerate>=0.30",
    "safetensors>=0.4",
    "sentencepiece>=0.2",
    # bitsandbytes 0.43+ added CPU support; older versions need CUDA.
    "bitsandbytes>=0.43; platform_system != 'Darwin'",
]
all = [
    "pyautogui>=0.9.54",
    "pillow>=10.0",
    "playwright>=1.42",
    "beautifulsoup4>=4.12",
    "mcp>=1.0",
    "PySide6>=6.6",
    "pygments>=2.17",
]
dev = [
    "pytest>=8.0",
    "pytest-asyncio>=0.23",
    "ruff>=0.4",
    "respx>=0.21",
]

[project.scripts]
devin-local = "devin_local.cli:main"
devin-local-layered = "devin_local.cli:main_layered"
devin-local-gui = "devin_local.cli:main_gui"

[project.gui-scripts]
# Windows: invoking these without a console window (so launching from the
# Start Menu doesn't spawn a black box).
devin-local-gui-app = "devin_local.cli:main_gui"

[project.urls]
Homepage = "https://github.com/johnesecat/devin-local"
Issues = "https://github.com/johnesecat/devin-local/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
"devin_local" = ["py.typed", "skills/builtins/*.md"]

[tool.ruff]
line-length = 100
target-version = "py310"
extend-exclude = ["tests/fixtures", "examples"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "TID"]
ignore = [
    "E501",   # long lines are fine for prompts
    "B008",   # default arg call (typer style)
    "SIM108", # ternary not always clearer
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = "-ra -q"
